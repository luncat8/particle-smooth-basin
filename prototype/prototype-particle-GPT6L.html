<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hydrogel Basin</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101923;
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .label {
      position: fixed;
      top: 14px;
      left: 16px;
      color: #d9f5ff;
      font-size: 13px;
      letter-spacing: .03em;
      opacity: .8;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="label">Hydrogel beads · drag to stir · click to add beads</div>
  <canvas id="scene"></canvas>

  <script>
    const canvas = document.querySelector("#scene");
    const ctx = canvas.getContext("2d");

    let W, H, dpr;
    let balls = [];
    let dragging = false;
    let pointer = { x: 0, y: 0, px: 0, py: 0 };
    let lastTime = 0;

    const basin = {
      left: 0,
      right: 0,
      bottom: 0,
      surface: 0
    };

    const GRAVITY = 1250;          // px/s²
    const WATER_DENSITY = 1.0;     // relative density
    const AIR_DRAG = 0.999;
    const WATER_DRAG = 0.986;
    const RESTITUTION = 0.18;
    const WALL_RESTITUTION = 0.35;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      basin.left = W * 0.12;
      basin.right = W * 0.88;
      basin.bottom = H * 0.93;
      basin.surface = H * 0.80;

      if (!balls.length) seedBalls();
    }

    function makeBall(x, y, r) {
      // Relative density around water density: lighter balls float, heavier ones sink.
      const density = 0.62 + Math.random() * 0.95;
      const hue = 183 + Math.random() * 48;
      return {
        x, y, vx: (Math.random() - 0.5) * 80,
        vy: (Math.random() - 0.5) * 40,
        r, density, hue,
        mass: Math.PI * r * r * density
      };
    }

    function seedBalls() {
      balls = [];
      const availableW = basin.right - basin.left;
      const count = Math.floor(Math.min(125, Math.max(50, availableW * H / 4400)));

      for (let i = 0; i < count; i++) {
        const r = 9 + Math.random() * 15;
        const x = basin.left + r + Math.random() * (availableW - 2 * r);
        // Start in a pile; the compressed beads will push one another upward.
        const y = basin.bottom - r - Math.random() * H * 0.42;
        const b = makeBall(x, y, r);
        b.vy = -Math.random() * 100;
        balls.push(b);
      }
    }

    function addBall(x, y) {
      const r = 9 + Math.random() * 15;
      balls.push(makeBall(x, y, r));
    }

    // Approximate fraction of a circular bead below the water surface.
    function submergedFraction(ball) {
      const h = ball.y + ball.r - basin.surface;
      if (h <= 0) return 0;
      if (h >= 2 * ball.r) return 1;

      const r = ball.r;
      const segmentArea =
        r * r * Math.acos((r - h) / r) -
        (r - h) * Math.sqrt(Math.max(0, 2 * r * h - h * h));

      return segmentArea / (Math.PI * r * r);
    }

    function update(dt) {
      const substeps = 3;
      const step = dt / substeps;

      for (let s = 0; s < substeps; s++) {
        for (const b of balls) {
          const submerged = submergedFraction(b);

          // Archimedes: buoyant force equals displaced water weight.
          // Acceleration combines gravity and buoyancy, scaled by bead density.
          const accelerationY =
            GRAVITY * (1 - WATER_DENSITY * submerged / b.density);

          b.vy += accelerationY * step;

          const drag = submerged > 0 ? WATER_DRAG : AIR_DRAG;
          b.vx *= Math.pow(drag, step * 60);
          b.vy *= Math.pow(drag, step * 60);

          if (dragging) {
            const dx = b.x - pointer.x;
            const dy = b.y - pointer.y;
            const distance = Math.hypot(dx, dy);
            const reach = 85 + b.r;
            if (distance < reach && distance > 0.01) {
              const strength = (1 - distance / reach) * 900;
              b.vx += (dx / distance) * strength * step;
              b.vy += (dy / distance) * strength * step;
              b.vx += (pointer.x - pointer.px) * 0.8;
              b.vy += (pointer.y - pointer.py) * 0.8;
            }
          }

          b.x += b.vx * step;
          b.y += b.vy * step;
        }

        resolveCollisions();
        containBalls();
      }
    }

    function resolveCollisions() {
      for (let i = 0; i < balls.length; i++) {
        const a = balls[i];
        for (let j = i + 1; j < balls.length; j++) {
          const b = balls[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let distance = Math.hypot(dx, dy);
          const minDistance = a.r + b.r;

          if (distance < minDistance) {
            if (distance < 0.001) {
              dx = 0.01;
              dy = 0;
              distance = 0.01;
            }

            const nx = dx / distance;
            const ny = dy / distance;
            const overlap = minDistance - distance;
            const totalMass = a.mass + b.mass;

            // Separate overlapping beads in proportion to their mass.
            a.x -= nx * overlap * (b.mass / totalMass);
            a.y -= ny * overlap * (b.mass / totalMass);
            b.x += nx * overlap * (a.mass / totalMass);
            b.y += ny * overlap * (a.mass / totalMass);

            // Collision impulse.
            const relativeVx = b.vx - a.vx;
            const relativeVy = b.vy - a.vy;
            const closingSpeed = relativeVx * nx + relativeVy * ny;

            if (closingSpeed < 0) {
              const impulse =
                -(1 + RESTITUTION) * closingSpeed /
                (1 / a.mass + 1 / b.mass);

              a.vx -= impulse * nx / a.mass;
              a.vy -= impulse * ny / a.mass;
              b.vx += impulse * nx / b.mass;
              b.vy += impulse * ny / b.mass;
            }
          }
        }
      }
    }

    function containBalls() {
      for (const b of balls) {
        if (b.x - b.r < basin.left) {
          b.x = basin.left + b.r;
          b.vx = Math.abs(b.vx) * WALL_RESTITUTION;
        }
        if (b.x + b.r > basin.right) {
          b.x = basin.right - b.r;
          b.vx = -Math.abs(b.vx) * WALL_RESTITUTION;
        }
        if (b.y + b.r > basin.bottom) {
          b.y = basin.bottom - b.r;
          if (b.vy > 0) b.vy = -b.vy * WALL_RESTITUTION;
          b.vx *= 0.985;
        }
      }
    }

    function drawBasin() {
      // Water body, clipped to the basin.
      ctx.save();
      ctx.beginPath();
      ctx.rect(basin.left, basin.surface, basin.right - basin.left,
               basin.bottom - basin.surface);
      ctx.clip();

      const water = ctx.createLinearGradient(0, basin.surface, 0, basin.bottom);
      water.addColorStop(0, "rgba(40, 190, 220, 0.21)");
      water.addColorStop(1, "rgba(13, 95, 150, 0.48)");
      ctx.fillStyle = water;
      ctx.fillRect(basin.left, basin.surface, basin.right - basin.left,
                   basin.bottom - basin.surface);

      // Soft underwater light bands.
      ctx.fillStyle = "rgba(130, 240, 255, 0.07)";
      for (let i = 0; i < 5; i++) {
        const y = basin.surface + 30 + i * 55;
        ctx.fillRect(basin.left, y, basin.right - basin.left, 2);
      }
      ctx.restore();

      // Basin outline.
      ctx.lineWidth = 5;
      ctx.strokeStyle = "rgba(190, 229, 240, 0.66)";
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(basin.left, basin.surface - 8);
      ctx.lineTo(basin.left, basin.bottom);
      ctx.quadraticCurveTo(basin.left, basin.bottom + 12,
                           basin.left + 12, basin.bottom + 12);
      ctx.lineTo(basin.right - 12, basin.bottom + 12);
      ctx.quadraticCurveTo(basin.right, basin.bottom + 12,
                           basin.right, basin.bottom);
      ctx.lineTo(basin.right, basin.surface - 8);
      ctx.stroke();

      // Waterline.
      ctx.beginPath();
      ctx.moveTo(basin.left, basin.surface);
      ctx.lineTo(basin.right, basin.surface);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(150, 245, 255, 0.8)";
      ctx.stroke();
    }

    function drawBall(b) {
      const gradient = ctx.createRadialGradient(
        b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.08,
        b.x, b.y, b.r
      );
      gradient.addColorStop(0, `hsla(${b.hue}, 95%, 91%, 0.90)`);
      gradient.addColorStop(0.28, `hsla(${b.hue}, 82%, 72%, 0.67)`);
      gradient.addColorStop(0.72, `hsla(${b.hue}, 78%, 49%, 0.47)`);
      gradient.addColorStop(1, `hsla(${b.hue}, 82%, 29%, 0.68)`);

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.lineWidth = 1.2;
      ctx.strokeStyle = `hsla(${b.hue}, 90%, 91%, 0.72)`;
      ctx.stroke();

      // Small specular highlight for a translucent gel appearance.
      ctx.beginPath();
      ctx.ellipse(b.x - b.r * 0.26, b.y - b.r * 0.34,
                  b.r * 0.22, b.r * 0.11, -0.65, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.76)";
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#14212d");
      bg.addColorStop(1, "#20303a");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Subtle floor shadow.
      ctx.beginPath();
      ctx.ellipse(W / 2, basin.bottom + 16, W * 0.4, 18, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fill();

      drawBasin();

      // Draw beads, then redraw waterline so it remains visible over them.
      for (const b of balls) drawBall(b);

      ctx.beginPath();
      ctx.moveTo(basin.left, basin.surface);
      ctx.lineTo(basin.right, basin.surface);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(150, 245, 255, 0.8)";
      ctx.stroke();
    }

    function frame(time) {
      const dt = Math.min((time - lastTime) / 1000 || 0, 0.025);
      lastTime = time;
      update(dt);
      draw();
      pointer.px = pointer.x;
      pointer.py = pointer.y;
      requestAnimationFrame(frame);
    }

    function setPointer(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = event.clientX - rect.left;
      pointer.y = event.clientY - rect.top;
    }

    canvas.addEventListener("pointerdown", event => {
      setPointer(event);
      dragging = true;
      canvas.setPointerCapture(event.pointerId);
      if (event.button === 0 && !event.shiftKey) addBall(pointer.x, pointer.y);
    });

    canvas.addEventListener("pointermove", setPointer);
    canvas.addEventListener("pointerup", () => dragging = false);
    canvas.addEventListener("pointercancel", () => dragging = false);

    window.addEventListener("resize", () => {
      resize();
      // Keep existing beads inside the resized basin.
      containBalls();
    });

    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
